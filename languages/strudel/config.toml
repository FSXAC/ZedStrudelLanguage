name = "Strudel"
grammar = "javascript"
path_suffixes = ["strudel", "str"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 2
word_characters = ["$"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "/*", end = " */", close = true, newline = false, not_in = ["comment", "string"] },
]

[overrides.string]
completion_query_characters = ["_", ":"]
